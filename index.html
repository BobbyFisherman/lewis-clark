{const vs=$('vines');[[0,0,1,1],[500,0,0,1],[1000,-10,0,1],[1600,0,-1,1],[0,400,1,0],[1600,500,-1,0],[0,900,1,-1],[800,900,0,-1],[1600,900,-1,-1],[300,0,.5,1],[1300,0,-.5,1]].forEach(([x,y,dx,dy],k)=>{
 const g=el('g',{class:'vine',style:`transform-origin:${x}px ${y}px;animation-delay:-${k*.8}s`},vs);let a=Math.atan2(dy,dx),px=x,py=y;const pts=[[x,y]];
 for(let i=0;i<7;i++){a+=(R()-.5)*1.2;px+=Math.cos(a)*65;py+=Math.sin(a)*65;pts.push([px,py])}
 const p=el('path',{d:sm(pts),fill:'none',stroke:'#17220f','stroke-width':6,'stroke-linecap':'round'},g),L=p.getTotalLength();
 for(let l=18,i=0;l<L;l+=22,i++){const q=p.getPointAtLength(l),n=p.getPointAtLength(l+2),an=Math.atan2(n.y-q.y,n.x-q.x)*57.3+(i%2?70:-70);
  el('path',{d:'M0 0C6-10 20-12 30 0C20 12 6 10 0 0Z',fill:['#2d4a1f','#3a5f26','#22391a'][i%3],stroke:'#0c1408','stroke-width':1.2,transform:`translate(${q.x} ${q.y}) rotate(${an}) scale(${.8+R()*.8})`},g)}})}
// game
const COL=['#b23a30','#3a6ea5','#5a8a3a','#d19a22'],OFF=[[-17,-8],[17,-8],[-17,12],[17,12]];
const Q=[["Which river did the Corps paddle up into the new territory?",["Missouri River","Hudson River","Rio Grande"]],["Who guided and interpreted for the group?",["Sacajawea","Betsy Ross","Pocahontas"]],["Who sold the Louisiana Territory to the U.S.?",["France","Spain","Mexico"]],["Who sent Lewis and Clark west?",["Thomas Jefferson","Ben Franklin","Abe Lincoln"]],["Which captain was the expedition mapmaker?",["William Clark","Daniel Boone","Paul Revere"]],["Which St. Louis landmark is the Gateway to the West?",["Gateway Arch","Statue of Liberty","Space Needle"]]];
const WILD=[["You hunt elk and feast. +2 supplies.",2],["Mosquitoes swarm the camp. −1 supply.",-1],["A storm soaks the food. −1 supply.",-1],["You find wild plums and roots. +1 supply.",1],["Grizzly tracks! You hide for a day. −1 supply.",-1]];
let pl=[],cur=0,busy=true,qi=0;const cam={x:S[0].x,y:S[0].y,w:800},tg={...cam};
(function loop(){cam.x+=(tg.x-cam.x)*.09;cam.y+=(tg.y-cam.y)*.09;cam.w+=(tg.w-cam.w)*.07;const hh=cam.w*map.clientHeight/map.clientWidth;map.setAttribute('viewBox',`${cam.x-cam.w/2} ${cam.y-hh/2} ${cam.w} ${hh}`);requestAnimationFrame(loop)})();
function pop(hd,tx,b,cls){const k=$('card');k.innerHTML=`<h2>${hd}</h2>${tx?'<p>'+tx+'</p>':''}`;b.forEach(x=>{const e=document.createElement('button');e.innerHTML=x[0];if(cls)e.className=cls;e.onclick=async()=>{$('modal').classList.remove('on');await x[1]()};k.appendChild(e)});$('modal').classList.add('on')}
function rules(){$('card').innerHTML=`<h2>Rules</h2><p><b>Goal:</b> be the first explorer to reach the Pacific Ocean at Fort Clatsop.</p><ol><li>2–4 players take turns. The map follows whoever is playing.</li><li>On your turn choose <b>Push On</b> (roll the die and move, costs 1 supply) or <b>Rest &amp; Forage</b> (gain 2 supplies, move 1).</li><li>Stops with a landmark give you a choice. Some choices are safe, some are risky.</li><li>Green <b>?</b> stones ask a question: right answer = ahead 2 and +1 supply.</li><li>Brown <b>~</b> stones are wilderness events that change your supplies.</li><li>With 0 supplies you must rest.</li></ol><h2 style="margin-top:10px">Key Terms</h2><ul><li><b>Meriwether Lewis</b> – captain and scientist of the expedition.</li><li><b>William Clark</b> – co-captain and mapmaker.</li><li><b>Sacajawea</b> – Shoshone guide and interpreter.</li><li><b>Louisiana Purchase</b> – 1803 land deal with France that doubled the U.S.</li><li><b>Missouri River</b> – the river they followed west.</li></ul><h2 style="margin-top:10px">Why it mattered</h2><p>From 1804 to 1806 they mapped the new land, met its peoples, recorded its plants and animals, and looked for a route to the Pacific. It opened the West to settlers and greatly affected the Native nations who already lived there.</p><button onclick="$('modal').classList.remove('on')">Close</button>`;$('modal').classList.add('on')}
function begin(){pop('Choose Explorers','How many will travel west?',[2,3,4].map(n=>[n+' players',async()=>start(n)]))}
function start(n){$('pawns').innerHTML='';pl=[];for(let i=0;i<n;i++){const g=el('g',{class:'pawn'},$('pawns'));g.innerHTML=`<g class="in"><ellipse cy="14" rx="20" ry="6" fill="#0009"/><path d="M-17 14Q-14-8 0-10Q14-8 17 14Z" fill="${COL[i]}" stroke="#120a04" stroke-width="3"/><circle cy="-22" r="12" fill="${COL[i]}" stroke="#120a04" stroke-width="3"/><circle cy="-22" r="12" fill="url(#hd)"/></g>`;pl.push({n:'Explorer '+(i+1),pos:0,sp:5,g,c:COL[i]})}
 cur=0;pl.forEach(put);ui();focus(0);unlock();pop(W[0].n+', 1803',W[0].t,[['Begin the journey',async()=>{banner()}]])}
function put(p){const s=S[p.pos],o=OFF[pl.indexOf(p)];p.g.style.transform=`translate(${s.x+o[0]}px,${s.y+o[1]-14}px)`;if(p==pl[cur])focus(0)}
function focus(fly){const s=S[pl[cur].pos];tg.x=s.x;tg.y=s.y+50;$('halo').style.transform=`translate(${s.x}px,${s.y}px)`;if(fly){tg.w=1600;setTimeout(()=>tg.w=800,650)}else tg.w=800}
function banner(){const b=$('banner');b.textContent=pl[cur].n;b.style.color=pl[cur].c;b.classList.remove('go');void b.offsetWidth;b.classList.add('go')}
function ui(){$('plates').innerHTML=pl.map((p,i)=>`<div class="plate ${i==cur?'act':''}" style="--c:${p.c}">${p.n} · ${p.pos}/${FIN}<br>${[...Array(8)].map((_,j)=>`<span class="pip ${j<p.sp?'':'o'}"></span>`).join('')}</div>`).join('');pl.forEach((p,i)=>p.g.classList.toggle('act',i==cur))}
const lock=()=>{busy=true;$('bPush').disabled=$('bRest').disabled=true},unlock=()=>{busy=false;$('bRest').disabled=false;$('bPush').disabled=pl[cur].sp<=0;$('msg').textContent=`${pl[cur].n}: push on, or rest?`};
const sup=(p,d)=>{p.sp=Math.max(0,Math.min(8,p.sp+d));ui()};
async function push(){if(busy)return;lock();const p=pl[cur];sup(p,-1);const d=$('die');d.classList.add('roll');for(let i=0;i<9;i++){d.textContent='⚀⚁⚂⚃⚄⚅'[Math.floor(R()*6)];await sleep(70)}d.classList.remove('roll');const v=1+Math.floor(Math.random()*6);d.textContent='⚀⚁⚂⚃⚄⚅'[v-1];$('msg').textContent=`${p.n} rolled ${v}!`;await sleep(400);await move(v)}
async function rest(){if(busy)return;lock();sup(pl[cur],2);$('msg').textContent='Resting and foraging…';await sleep(700);await move(1,1)}
async function move(v,silent){const p=pl[cur];for(let i=0;i<Math.abs(v);i++){p.pos=Math.max(0,Math.min(FIN,p.pos+Math.sign(v)));put(p);ui();await sleep(330);if(p.pos==FIN)break}
 if(p.pos==FIN)return win(p);if(silent)return next();const s=S[p.pos];
 if(s.ty=='q')return ask();
 if(s.ty=='r'){const w=WILD[Math.floor(Math.random()*WILD.length)];return pop('The Wilderness',w[0],[['Continue',async()=>{sup(p,w[1]);next()}]])}
 if(s.ty=='w'){const w=s.w;return pop(w.n+' · '+w.lm,w.t,w.o.map(o=>[o[0]+(o[1]<1?` <small>${o[1]*100}% chance</small>`:''),()=>resolve(o)]),'opt')}
 next()}
function resolve(o){const p=pl[cur],ok=Math.random()<o[1],mv=ok?o[2]:o[5],sp=ok?o[3]:o[6],tx=ok?o[4]:o[7];sup(p,sp);pop(ok?'Success':'Setback',tx,[['Continue',async()=>{mv?await move(mv,1):next()}]])}
function ask(){const q=Q[qi++%Q.length],s=S[pl[cur].pos],o=q[1].map((t,i)=>[t,i==0]).sort(()=>Math.random()-.5);
 pop((s.w?s.w.n+' · ':'')+'Question',q[0],o.map(a=>[a[0],async()=>{if(a[1])pop('Correct!','Ahead 2 and +1 supply.',[['Go',async()=>{sup(pl[cur],1);await move(2,1)}]]);else pop('Not quite','The answer was '+q[1][0]+'.',[['OK',async()=>next()]])}]),'opt')}
function next(){cur=(cur+1)%pl.length;ui();$('blink').classList.remove('go');void $('blink').offsetWidth;$('blink').classList.add('go');focus(1);banner();unlock()}
function win(p){$('msg').textContent=p.n+' reaches the Pacific!';pop('Fort Clatsop · The Pacific!',p.n+' wins! The trip mapped the Louisiana Territory and changed America forever.',[['Play again',async()=>start(pl.length)]])}
addEventListener('load',begin);
</script></body></html>
